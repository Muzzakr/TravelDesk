name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# These credentials only ever point at the disposable `postgres` service
# container below, which lives for the duration of this job and is used
# solely to catch schema/migration drift (see "Check for schema drift").
# Real secrets (Supabase, AUTH_SECRET, etc.) live in Vercel, never here.
env:
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
  DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
  AUTH_SECRET: ci-placeholder-secret-not-used-in-production
  NEXTAUTH_URL: http://localhost:3000

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit -p .

      - name: Lint
        run: npx next lint --max-warnings=0

      # Applies every committed migration to a throwaway database, then
      # diffs the result against schema.prisma. A non-empty diff means the
      # migrations folder and schema.prisma have drifted apart — exactly
      # the bug that broke a fresh clone before (see migration
      # 20260726030000_sync_schema_drift for the history).
      - name: Check for schema drift
        run: |
          npx prisma migrate deploy
          npx prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code

      - name: Test
        run: npx jest

      - name: Build
        run: npm run build
